[pytest]
markers =
    aws: requires live AWS credentials and a writable DynamoDB test table (#41). Excluded by default; run with `pytest -m aws`.
    mariadb: requires a live MariaDB connection to a test ReciterDB schema (#43). Excluded by default; run with `pytest -m mariadb`.

# CI / `pytest` with no -m flag runs only the mock-based unit tests. The
# live-AWS and live-MariaDB integration suites are opt-in to keep CI fast
# and avoid spending real-resource quota on every test invocation.
addopts = -m "not aws and not mariadb"
