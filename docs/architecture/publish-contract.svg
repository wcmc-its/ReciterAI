<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 580" width="1340" height="580" role="img" aria-labelledby="t-publish-contract d-publish-contract" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-publish-contract">Publish contract — the hand-off to SPS</title><desc id="d-publish-contract">The interface that matters to anyone integrating: ReciterAI publishes, the Scholars Profile System pulls. Two S3 channels carry the canonical hierarchy and spotlight artifacts (versioned for production, latest/ for dev, a co-published JSON Schema, and a manifest.json whose sha256 lets the ETL short-circuit when nothing changed); DynamoDB carries the record-level data. ReciterAI never calls SPS.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="24" y="232" width="242" height="132" rx="14" fill="#e3faf3" fill-opacity="0.16" stroke="#0ca678" stroke-width="1.4"><title>Producer</title></rect><rect x="310" y="92" width="360" height="452" rx="14" fill="#fff4d6" fill-opacity="0.16" stroke="#f08c00" stroke-width="1.4"><title>Published channels (AWS)</title></rect><rect x="710" y="100" width="340" height="420" rx="14" fill="#e7ecff" fill-opacity="0.16" stroke="#4263eb" stroke-width="1.4"><title>SPS ETLs (pull)</title></rect><rect x="1074" y="232" width="242" height="160" rx="14" fill="#fbeaea" fill-opacity="0.16" stroke="#7d1c1c" stroke-width="1.4"><title>Consumer</title></rect><path d="M250,269.2 C290.7385270229546,269.2 289.2614729770454,180 330,180" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M250,298 C286,298 294,322 330,322" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M250,326.8 C302.82842931604154,326.8 277.17157068395846,460 330,460" fill="none" stroke="#f08c00" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mAmber)"/><path d="M650,180 C686,180 694,180 730,180" fill="none" stroke="#7d1c1c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mMaroon)"/><path d="M650,322 C686,322 694,312 730,312" fill="none" stroke="#7d1c1c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mMaroon)"/><path d="M650,460 C686,460 694,448 730,448" fill="none" stroke="#7d1c1c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mMaroon)"/><path d="M1030,180 C1069.650472884948,180 1050.349527115052,280 1090,280" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M1030,312 C1066,312 1054,316 1090,316" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><path d="M1030,448 C1068.490643018791,448 1051.509356981209,352 1090,352" fill="none" stroke="#4263eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mIndigo)"/><rect x="228.425" y="215.1" width="123.14999999999999" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="290" y="228" font-size="10" fill="#3a434f" text-anchor="middle">versioned + latest/</text><rect x="266.45" y="383.9" width="47.099999999999994" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="290" y="396.79999999999995" font-size="10" fill="#3a434f" text-anchor="middle">upsert</text><rect x="660.6" y="170.5" width="58.8" height="18" rx="9" fill="#ffffff" stroke="#7d1c1c" stroke-opacity="0.45"/><text x="690" y="183.4" font-size="10" fill="#3a434f" text-anchor="middle">manifest</text><rect x="672.3" y="444.5" width="35.4" height="18" rx="9" fill="#ffffff" stroke="#7d1c1c" stroke-opacity="0.45"/><text x="690" y="457.4" font-size="10" fill="#3a434f" text-anchor="middle">scan</text><rect x="1042.3" y="220.5" width="35.4" height="18" rx="9" fill="#ffffff" stroke="#4263eb" stroke-opacity="0.45"/><text x="1060" y="233.4" font-size="10" fill="#3a434f" text-anchor="middle">load</text><g><rect x="40" y="219" width="70.8" height="26" rx="8" fill="#ffffff" stroke="#0ca678" stroke-width="1.2"/><text x="75.4" y="236.5" font-size="12" font-weight="700" fill="#0b6e4f" text-anchor="middl