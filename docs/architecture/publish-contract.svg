e}/ hierarchy.schema.json</text><text x="344" y="181" font-size="11" fill="#5b6470">v{ISO-date}/ diff.json · manifest.json</text><text x="344" y="196" font-size="11" fill="#5b6470">latest/ (overwritten) · sha256</text></g><g><title>S3 · wcmc-reciterai-artifacts — spotlight/v{ISO-date}/spotlight.json; spotlight/latest/spotlight.json</title><rect x="330" y="276" width="320" height="92" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="342" y="291" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="358" y="300" font-size="13.5" font-weight="700" fill="#8a5a00">S3 · wcmc-reciterai-artifacts</text><text x="344" y="317" font-size="11" fill="#5b6470">spotlight/v{ISO-date}/spotlight.json</text><text x="344" y="332" font-size="11" fill="#5b6470">spotlight/latest/spotlight.json</text></g><g><title>DynamoDB · reciterai — TOPIC# — scores + subtopics; FACULTY# — rollups; IMPACT# — synopsis + impact; SPOTLIGHT# — records</title><rect x="330" y="394" width="320" height="132" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="342" y="409" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="358" y="418" font-size="13.5" font-weight="700" fill="#8a5a00">DynamoDB · reciterai</text><text x="344" y="435" font-size="11" fill="#5b6470">TOPIC# — scores + subtopics</text><text x="344" y="450" font-size="11" fill="#5b6470">FACULTY# — rollups</text><text x="344" y="465" font-size="11" fill="#5b6470">IMPACT# — synopsis + impact</text><text x="344" y="480" font-size="11" fill="#5b6470">SPOTLIGHT# — records</text></g><g><title>SPS · etl/hierarchy — GET latest/manifest.json; sha256 unchanged → skip; else validate vs schema → upsert</title><rect x="730" y="120" width="300" height="120" rx="10" fill="#e7ecff" stroke="#4263eb" stroke-width="1.6" filter="url(#sh)"/><rect x="742" y="135" width="9" height="9" rx="2.5" fill="#4263eb"/><text x="758" y="144" font-size="13.5" font-weight="700" fill="#2b3a8c">SPS · etl/hierarchy