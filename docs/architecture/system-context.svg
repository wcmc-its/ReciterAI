<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 560" width="1480" height="560" role="img" aria-labelledby="t-system-context d-system-context" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-system-context">System context</title><desc id="d-system-context">The picture for newcomers: ReciterAI reads the WCM publication corpus from ReciterDB and a frozen taxonomy, runs a seven-stage LLM pipeline against AWS Bedrock (with an OpenAI fallback), and publishes to two S3 buckets + DynamoDB. The Scholars Profile System pulls from those — ReciterAI is upstream and ships independently.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="20" y="96" width="330" height="220" rx="14" fill="#f1f3f5" fill-opacity="0.16" stroke="#adb5bd" stroke-width="1.4"><title>Data sources</title></rect><rect x="430" y="110" width="360" height="220" rx="14" fill="#fbeaea" fill-opacity="0.16" stroke="#7d1c1c" stroke-width="1.4"><title>ReciterAI service</title></rect><rect x="430" y="362" width="360" height="150" rx="14" fill="#f0ebff" fill-opacity="0.16" stroke="#7048e8" stroke-width="1.4"><title>Model providers</title></rect><rect x="860" y="104" width="340" height="320" rx="14" fill="#fff4d6" fill-opacity="0.16" stroke="#f08c00" stroke-width="1.4"><title>Published outputs (AWS)</title></rect><rect x="1216" y="104" width="248" height="320" rx="14" fill="#e7ecff" fill-opacity="0.16" stroke="#4263eb" stroke-width="1.4"><title>Consumer (downstream)</title></rect><path d="M330,165 C372.36918427347877,165 407.63081572652123,198.6 450,198.6" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M330,259 C370.8826066409665,259 409.1173933590335,266.64 450,266.64" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mTeal)"/><path d="M578,312 C578,348 542,364 542,400" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#mViolet)"/><path d="M712.4,312 C712.4,348 710,364 710,400" fill="none" stroke="#868e96" stroke-width="1.8" stroke-l