publications, abstracts; faculty (CWID), keyword-relevance</title><rect x="40" y="132" width="290" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="147" width="9" height="9" rx="2.5" fill="#868e96"/><text x="68" y="156" font-size="13.5" font-weight="700" fill="#343a40">ReciterDB</text><text x="54" y="173" font-size="11" fill="#5b6470">MariaDB · publications, abstracts</text><text x="54" y="188" font-size="11" fill="#5b6470">faculty (CWID), keyword-relevance</text><rect x="264.7" y="142" width="55.300000000000004" height="17" rx="8.5" fill="#e7f6ef"/><text x="292.35" y="154" font-size="10" font-weight="700" fill="#157a52" text-anchor="middle">nightly</text></g><g><title>taxonomy_v2.json — frozen 67-topic taxonomy; human-approved · in-repo</title><rect x="40" y="226" width="290" height="66" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="52" y="241" width="9" height="9" rx="2.5" fill="#868e96"/><text x="68" y="250" font-size="13.5" font-weight="700" fill="#343a40">taxonomy_v2.json</text><text x="54" y="267" font-size="11" fill="#5b6470">frozen 67-topic taxonomy</text><text x="54" y="282" font-size="11" fill="#5b6470">human-approved · in-repo</text><rect x="270.6" y="236" width="49.400000000000006" height="17" rx="8.5" fill="#eceff8"/><text x="295.3" y="248" font-size="10" font-weight="700" fill="#43547e" text-anchor="middle">frozen</text></g><g><title>ReciterAI pipeline — 1 · taxonomy (cold · frozen); 2 · score pubs (Haiku → Sonnet); 3 · subtopics: discover + assign; 4 · faculty rollups (by CWID); 5 · enrichment: synopsis + impact; 6 · spotlight (lede + critic); 7 · publish artifacts</title><rect x="450" y="150" width="320" height="162" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="462" y="165" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="478" y="174" font-size="13.5" font-weight="700" fill="#0b6e4f">ReciterAI pipeline</tex