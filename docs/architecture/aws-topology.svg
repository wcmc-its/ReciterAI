="307.375" y="329.06" width="41.25" height="18" rx="9" fill="#ffffff" stroke="#0ca678" stroke-opacity="0.45"/><text x="328" y="341.96" font-size="10" fill="#3a434f" text-anchor="middle">delta</text><rect x="298.6" y="460.9" width="58.8" height="18" rx="9" fill="#ffffff" stroke="#0ca678" stroke-opacity="0.45"/><text x="328" y="473.79999999999995" font-size="10" fill="#3a434f" text-anchor="middle">gap scan</text><rect x="660.45" y="122.20000000000002" width="47.099999999999994" height="18" rx="9" fill="#ffffff" stroke="#7048e8" stroke-opacity="0.45"/><text x="684" y="135.10000000000002" font-size="10" fill="#3a434f" text-anchor="middle">invoke</text><rect x="669.225" y="251.89999999999998" width="29.549999999999997" height="18" rx="9" fill="#ffffff" stroke="#f08c00" stroke-opacity="0.45"/><text x="684" y="264.79999999999995" font-size="10" fill="#3a434f" text-anchor="middle">r/w</text><rect x="649.525" y="400.5" width="52.949999999999996" height="18" rx="9" fill="#ffffff" stroke="#7048e8" stroke-opacity="0.45"/><text x="676" y="413.4" font-size="10" fill="#3a434f" text-anchor="middle">secrets</text><rect x="657.525" y="332.9" width="52.949999999999996" height="18" rx="9" fill="#ffffff" stroke="#7d1c1c" stroke-opacity="0.45"/><text x="684" y="345.79999999999995" font-size="10" fill="#3a434f" text-anchor="middle">publish</text><rect x="870.6" y="40.5" width="58.8" height="18" rx="9" fill="#ffffff" stroke="#868e96" stroke-opacity="0.45"/><text x="900" y="53.4" font-size="10" fill="#3a434f" text-anchor="middle">fallback</text><rect x="837.375" y="294.5" width="41.25" height="18" rx="9" fill="#ffffff" stroke="#868e96" stroke-opacity="0.45"/><text x="858" y="307.4" font-size="10" fill="#3a434f" text-anchor="middle">alert</text><rect x="973.525" y="368.5" width="52.949999999999996" height="18" rx="9" fill="#ffffff" stroke="#7d1c1c" stroke-opacity="0.45"/><text x="1000" y="381.4" font-size="10" fill="#3a434f" text-anchor="middle">consume</text><g><rect x="44" y="91" width="77.4" height="26" rx="8" fill="#ffffff" stroke="#7048e8" stroke-width="1.2"/><text x="82.7" y="108.5" font-size="12" font-weight="700" fill="#4a2fb0" text-anchor="middle">Scheduler</text></g><g><rect x="44" y="331" width="57.599999999999994" height="26" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/><text x="72.8" y="348.5" font-size="12" font-weight="700" fill="#343a40" text-anchor="middle">Source</text></g><g><rect x="360" y="67" width="117" height="26" rx="8" fill="#ffffff" stroke="#0ca678" stroke-width="1.2"/><text x="418.5" y="84.5" font-size="12" font-weight="700" fill="#0b6e4f" text-anchor="middle">Compute targets</text></g><g><rect x="720" y="67" width="163.2" height="26" rx="8" fill="#ffffff" stroke="#7048e8" stroke-width="1.2"/><text x="801.6" y="84.5" font-size="12" font-weight="700" fill="#4a2fb0" text-anchor="middle">AWS data / model plane</text></g><g><rect x="1040" y="67" width="143.39999999999998" height="26" rx="8" fill="#ffffff" stroke="#4263eb" stroke-width="1.2"/><text x="1111.7" y="84.5" font-size="12" font-weight="700" fill="#2b3a8c" text-anchor="middle">External + consumer</text></g><g><title>EventBridge — hot · cron(0 12 ? * MON *); enrichment · cron(0 11 * * ? *); onboarding · cron(0 13 * * ? *); drift · cron(0 14 * * ? *); spotlight · cron(0 13 1 * ? *)</title><rect x="44" y="124" width="252" height="184" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="56" y="139" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="72" y="148" font-size="13.5" font-weight="700" fill="#4a2fb0">EventBridge</text><text x="58" y="165" font-size="11" fill="#5b6470">hot · cron(0 12 ? * MON *)</text><text x="58" y="180" font-size="11" fill="#5b6470">enrichment · cron(0 11 * * ? *)</text><text x="58" y="195" font-size="11" fill="#5b6470">onboarding · cron(0 13 * * ? *)</text><text x="58" y="210" font-size="11" fill="#5b6470">drift · cron(0 14 * * ? *)</text><text x="58" y="225" font-size="11" fill="#5b6470">spotlight · cron(0 13 1 * ? *)</text></g><g><title>ReciterDB — MariaDB · in-VPC read</title><rect x="44" y="364" width="252" height="72" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.6" filter="url(#sh)"/><rect x="56" y="379" width="9" height="9" rx="2.5" fill="#868e96"/><text x="72" y="388" font-size="13.5" font-weight="700" fill="#343a40">ReciterDB</text><text x="58" y="405" font-size="11" fill="#5b6470">MariaDB · in-VPC read</text></g><g><title>Step Functions · hot-path — score → assign → top_topic → rollup; weekly delta</title><rect x="360" y="96" width="288" height="84" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="372" y="111" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="388" y="120" font-size="13.5" font-weight="700" fill="#4a2fb0">Step Functions · hot-path</text><text x="374" y="137" font-size="11" fill="#5b6470">score → assign → top_topic → rollup</text><text x="374" y="152" font-size="11" fill="#5b6470">weekly delta</text></g><g><title>ECS Fargate · enrichment — run_daily_enrichment; synopsis + impact</title><rect x="360" y="208" width="288" height="84" rx="10" fill="#e3faf3" stroke="#0ca678" stroke-width="1.6" filter="url(#sh)"/><rect x="372" y="223" width="9" height="9" rx="2.5" fill="#0ca678"/><text x="388" y="232" font-size="13.5" font-weight="700" fill="#0b6e4f">ECS Fargate · enrichment</text><text x="374" y="249" font-size="11" fill="#5b6470">run_daily_enrichment</text><text x="374" y="264" font-size="11" fill="#5b6470">synopsis + impact</text></g><g><title>Lambda · spotlight-orchestrator — dirty-gate → backfill_spotlight</title><rect x="360" y="320" width="288" height="64" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="372" y="335" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="388" y="344" font-size="13.5" font-weight="700" fill="#4a2fb0">Lambda · spotlight-orchestrator</text><text x="374" y="361" font-size="11" fill="#5b6470">dirty-gate → backfill_spotlight</text></g><g><title>Lambda · drift-evaluator — events → DRIFT# + alerts</title><rect x="360" y="400" width="288" height="64" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="372" y="415" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="388" y="424" font-size="13.5" font-weight="700" fill="#4a2fb0">Lambda · drift-evaluator</text><text x="374" y="441" font-size="11" fill="#5b6470">events → DRIFT# + alerts</text></g><g><title>Lambda · onboarding-detector — gap scan → GitHub issues</title><rect x="360" y="480" width="288" height="64" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="372" y="495" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="388" y="504" font-size="13.5" font-weight="700" fill="#4a2fb0">Lambda · onboarding-detector</text><text x="374" y="521" font-size="11" fill="#5b6470">gap scan → GitHub issues</text></g><g><title>AWS Bedrock — Sonnet 4.6 · Haiku 4.5; Opus 4.7</title><rect x="720" y="96" width="240" height="84" rx="10" fill="#f0ebff" stroke="#7048e8" stroke-width="1.6" filter="url(#sh)"/><rect x="732" y="111" width="9" height="9" rx="2.5" fill="#7048e8"/><text x="748" y="120" font-size="13.5" font-weight="700" fill="#4a2fb0">AWS Bedrock</text><text x="734" y="137" font-size="11" fill="#5b6470">Sonnet 4.6 · Haiku 4.5</text><text x="734" y="152" font-size="11" fill="#5b6470">Opus 4.7</text></g><g><title>DynamoDB · reciterai — single table · 3 GSIs</title><rect x="720" y="208" width="240" height="80" rx="10" fill="#fff4d6" stroke="#f08c00" stroke-width="1.6" filter="url(#sh)"/><rect x="732" y="223" width="9" height="9" rx="2.5" fill="#f08c00"/><text x="748" y="232" font-size="13.5" font-weight="700" fill="#8a5a00">DynamoDB · reciterai</text><text x="734" y="249" font-size="11" fill="#5b6470">single table · 3 GSIs</text></g><g><title>S3 — reciterai-hierarchy; reciterai-artifacts</title><rect x="720" y="320" width="240" height="80" rx="10" fill="#fff4d6" st