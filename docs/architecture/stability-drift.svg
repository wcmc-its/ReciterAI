<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 740" width="1380" height="740" role="img" aria-labelledby="t-stability-drift d-stability-drift" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><title id="t-stability-drift">Stability &amp; drift — keeping it from jiggling</title><desc id="d-stability-drift">The dynamics the other six views freeze out. Three things jiggle every run: re-clustering relabels subtopics, the upstream author set churns, and daily grounding (synopsis + impact) moves — each of which would otherwise churn subtopic ids, spotlight ledes, and rankings. A band of stabilizers damps it: durable ids (match-or-mint keeps an id across rebuilds), the reconcile ladder (overlap → centroid → LLM, cached by input-hash), the STAGE# skip-cache, the lede/relabel skip gates, and the rotation selector. Watchdogs then measure the residual drift and alert.</desc><rect width="100%" height="100%" fill="#fbfcfe"/><defs><filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="1.4" stdDeviation="2.4" flood-color="#0b1f3a" flood-opacity="0.14"/></filter><marker id="mGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#868e96"/></marker><marker id="mMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7d1c1c"/></marker><marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#e03131"/></marker><marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#2f9e44"/></marker><marker id="mIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#4263eb"/></marker><marker id="mViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#7048e8"/></marker><marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#f08c00"/></marker><marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5,0.8 L9.4,5 L0.5,9.2 L3,5 Z" fill="#0ca678"/></marker></defs><rect x="24" y="84" width="266" height="380" rx="14" fill="#f1f3f5" fill-opacity="0.16" stroke="#adb5bd" stroke-width="1.4"><title>Sources of run-to-run jitter</title></rect><rect x="310" y="84" width="266" height="380" rx="14" fill="#e3faf3" fill-opacity="0.16" stroke="#0ca678" stroke-width="1.4"><title>Stabilizers · identity</title></rect><rect x="596" y="84" width="266" height="380" rx="14" fill="#e3faf3" fill-opacity="0.16" stroke="#0ca678" stroke-width="1.4"><title>Stabilizers · compute &amp; output</title></rect><rect x="882" y="84" width="266" height="380" rx="14" fill="#f0ebff" fill-opacity="0.16" stroke="#7048e8" stroke-width="1.4"><title>Watchdogs</title></rect><rect x="1162" y="150" width="200" height="250" rx="14" fill="#f1f3f5" fill-opacity="0.16" stroke="#adb5bd" stroke-width="1.4"><title>Alert sinks</title></rect><rect x="24" y="548" width="1338" height="160" rx="14" fill="#fff4d6" fill-opacity="0.16" stroke="#f08c00" stroke-width="1.4"><title>Durable state · DynamoDB (single table reciterai)</title></rect><path d="M270,162 C306,162 294,162 330,162" fill="none" stroke="#0ca678" stroke-width="1.8" stroke-linecap="rou