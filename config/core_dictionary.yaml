  #   saa3011 is NOT in identity but has 15 resolved-author rows in
  #   analysis_summary_author (unusual — present in author-resolution without a
  #   faculty/staff identity row — but real) -> tracked: true, consistent with
  #   the moderate service-staff row counts elsewhere in this file (e.g. #1's
  #   paz2005/las2017).
  #   nik2004 is in neither table (not a ReCiter target person, zero resolved
  #   rows) -> tracked: false, can't fire signal 2 at all.
  # Aliases are inferred qualified variants (no acknowledgment-text survey done
  # yet) since the bare 2-word name is a generic discipline term and would be
  # collision-prone per this file's own "no bare collision-prone terms" rule —
  # revisit once real candidate acknowledgment text is available to check
  # against.
  # ---------------------------------------------------------------------------

  - core_id: "14"
    name: Research Informatics
    facility: Research Informatics
    owner_cwid: null            # TBD — designate via SPS Superuser grant.
                                 # Intended owners: evs2008 (Evan Sholle),
                                 # nik2004 (Nivedita Chang), saa3011 (Sajjad
                                 # Abedian), thc2015 (Thomas Campion).
    # ALIAS SURVEY DONE 2026-09-03 (the "revisit once real acknowledgment text is
    # available" note above). `pipeline_cores.suggest_aliases` over the 69 papers
    # humans claimed for this core in SPS — 67 have PMC full text, 33 an <ack>:
    #   alias                                        full text   refs stripped
    #   Research Informatics                             16            11   <- DROPPED
    #   Research Informatics Core                         0             0   <- DROPPED
    #   Weill Cornell Medicine Research Informatics       0             0   <- DROPPED
    #   WCM Research Informatics                          2             2
    #   Architecture for Research Computing              12             9   <- ADDED
    #   ARCH (word-boundary, case-sensitive)              9             9   <- ADDED
    # The bare 2-word term is DANGEROUS, not merely collision-prone: 5 of its 16
    # hits are the REDCap citation in the REFERENCE LIST ("…workflow process for
    # providing translational research informatics support", Harris 2009), and
    # signal 3 scans the whole body including <ref-list>. Signal 3 carries +6.37
    # nats in combine(), enough to confirm on its own, so that alias would confirm
    # every paper on earth that cites REDCap. The rest of its hits are generic keyword-list uses of the
    # discipline term. ARCH ("Architecture for Research Computing in Healthcare")
    # is the actual institutional brand and is what the body text names.
    # NB the reference-list exposure is GENERIC to signal 3, not specific to this
    # core — any alias appearing in a commonly-cited title has it. Not fixed here.
    # PMC full-text search (pipeline_cores.pmc_search) over ALL of PMC, 2026-09-03:
    #   "Architecture for Research Computing in Health"      20
    #   "Architecture for Research Computing in Healthcare"   3
    #   "Architecture for Research Computing"                25   <- covers both
    #   "WCM Research Informatics"                            2
    # 25 papers name it; 17 are in the WCM corpus, 9 of those were already
    # hand-claimed (independent validation of the alias), 8 are new confirms.
    # "ARCH" dropped: over the 67 claimed papers with full text it buys exactly
    # ONE paper the spelled-out phrase misses, and \bARCH\b matches ARCH
    # econometric models. Signal 3 alone can carry a pair to confirmed, so that
    # trade is wrong.
    # INSIGHT SURVEY 2026-10-06. INSIGHT Clinical Research Network = the NYC PCORnet
    # CRN WCM leads; WCM's EHR slice reaches it through ARCH ("ARCH contributes data
    # on behalf of WCM. As the lead site of the INSIGHT Clinical Research Network…",
    # PMID 34850911). PMC full-text search (pipeline_cores.pmc_search), then the WCM
    # corpus filter (ingest.filter_corpus_pmids) and this core's DynamoDB rows:
    #   alias                                  PMC   in corpus   confirmed/claimed
    #   "INSIGHT Clinical Research Network"     76          45                  16   <- ADDED
    #   "INSIGHT CRN"                           33          18                  10   <- ADDED
    #   "INSIGHT Network"                      124          17                   6   <- REJECTED
    #   "INSIGHT" (bare)                         -           -                   -   <- REJECTED
    # Of the 45, 43 have PMC full text that names either phrase (40 the long form;
    # "INSIGHT CRN" adds 3 the long form misses). 0 are reference-list-only hits
    # (the REDCap failure mode); 1 names INSIGHT only in an author affiliation; the
    # rest say the analysis used INSIGHT data (methods 16 / body 13 / ack 11 for the
    # long form). Only 1 of the 43 also names an ARCH alias, so these are new
    # matches, not a re-find. 0 of this core's 20 rejected rows are among them.
    # Bare "INSIGHT" stays OUT. It is NOT an acronym to the matcher: signals._ACRONYM
    # is ^[A-Z0-9]{2,6}$ and INSIGHT has 7 letters, so _alias_pattern compiles it
    # case-INsensitive and it would match the English word "insight" in any paper.
    # esearch_count("INSIGHT") = 1,628,883 PMC hits -> ack.spec:generic (-5.07), and
    # ack + generic = 6.37 - 5.07 = +1.30 nats of evidence for every paper that says
    # "new insight into". It is also the NIAID HIV START/SMART trials network.
    # "INSIGHT Network" (124 hits) is shared with that trials network: of its 17
    # corpus PMIDs, 12 name it in text and 4 of those are the NIAID / Leidos INSIGHT
    # trials network (ACTIV acknowledgements). 124 hits is the MODERATE bucket, so a
    # match scores ack + ack.spec:moderate = 6.37 + 1.90 = 8.27 nats — a 1-in-3 false
    # positive at 8.27 nats. Out.
    # OWNER DECISION 2026-10-06: YES. A match means "used INSIGHT CRN data"; the core
    # 14 owner proposed INSIGHT himself, so INSIGHT pulls count as Research
    # Informatics usage. Revisit if core 14 reviewers REJECT INSIGHT-only matches:
