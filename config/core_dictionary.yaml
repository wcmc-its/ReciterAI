# Core dictionary — the project's real IP.
# One entry per WCM core facility: aliases (signal 3), staff CWIDs (signal 2),
# owner, and an LLM description (signal 4). Resolve staff to CWIDs against
# ReciterDB `identity` (match on resolved personIdentifier downstream, NEVER on
# surname — e.g. 511 resolved "Voss" rows are the oncologist mhv9001, not CBIC's
# hev2006). grant_ids stays empty: validation found no shared core grant.
#
# Four optional per-core keys, all with safe defaults (an entry without them runs):
#   partner_institutions: institutions that count as HOME for an alias match, beside
#     Weill Cornell itself. Absent = the shared Tri-I + NYP default; an explicit []
#     opts a core that is NOT shared out of partner credit.
#   alias_hits: alias -> global PMC hit count, cached by
#     `python3 -m pipeline_cores.refresh_alias_hits --write`. Alias specificity predicts
#     precision (r=-0.852 vs home%); never fetched during a scoring run.
#   clients: curated "known clients" of the core — a flat list of CWIDs, e.g.
#     `clients: [cwid1, cwid2]`. CWIDs ONLY: no names, no fuzzy matching, and NEVER a
#     surname (see the resolution rule above). Absent = no curated clients, which is
#     every core today; none is shipped because a real client list is curated data.
#     Unlike the author-affinity prior, which INFERS a core's users from prior
#     confirmations that need a reviewer nobody has, this ASSERTS them, so it works on
#     a core with no confirmations at all.
#     ponytail: a YAML list, not a table — ceiling is a few dozen CWIDs per core and
#     every edit costs a PR. The curation UI (unbuilt) writes an SPS table and can
#     export into exactly this shape when it exists; nothing here is built for it.
#   method_families: curated A2 METHOD FAMILIES whose presence in a paper is evidence
#     for this core, as `{strong|moderate|weak: [family label, ...]}`. Absent = no
#     curated families, which is every core but 14. Labels are the published
#     pipeline_tools taxonomy's own (s3://wcmc-reciterai-artifacts/tools/latest/
#     tools.json, .tools[].method_family_label, 816 of them at v2026-06-23); they are
#     stripped + casefolded at load, and an unknown TIER name RAISES rather than
#     silently matching nothing. Like `clients:` this ASSERTS something rather than
#     inferring it — a person decided which families mean this core's work.
#     PER FAMILY, never a flat "a curated tool was mentioned" boolean: the measured
#     lifts inside one core's own list span 399x down to 1.6x (see core 14 below), so a
#     single boolean would price the near-proof and the background together and be
#     wrong about both. Tiers, and the lifts under them, were measured 2026-09-05
#     against core 14's surfaced rows; re-measure before adding a core.
#
# Starting list = the 13 cores in
# "Projects/Inferring Cores and Services/Core inference prompt 0.txt".
# Only Biomedical Imaging is resolved so far.

