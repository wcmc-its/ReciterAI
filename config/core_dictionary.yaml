      - "Applied Bioinformatics Core (ABC)"
      - "Applied Bioinformatics Core at Weill Cornell Medicine"
    staff:
      - { cwid: dob2014, name: "Doron Betel",     dept: Medicine, tracked: true }
      - { cwid: paz2005, name: "Paul Zumbo",      dept: "Systems and Computational Biomedicine", tracked: true }
      - { cwid: las2017, name: "Lucy Skrabanek",  dept: "Systems and Computational Biomedicine", tracked: true }
      - { cwid: pim2001, name: "Piali Mukherjee", dept: Medicine, tracked: true }
    grant_ids: []
    llm_description: >
      bioinformatics service core: data management and analysis for high-throughput
      genomic assays — bulk/single-cell/spatial transcriptomics, epigenetics
      (ChIP-seq, ATAC-seq, bisulfite), variant calling, functional/pathway analysis,
      and standardized computational pipelines with QC and detailed reporting

