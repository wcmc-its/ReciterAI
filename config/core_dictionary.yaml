    # A2 METHOD FAMILIES, tiered by MEASURED LIFT, 2026-09-05. Positives = the 94 of
    # core 14's 240 surfaced (confirmed/claimed/candidate) rows that are in the A2
    # corpus; background = the 5,354 A2-corpus PMIDs with no core-14 row. Every weight
    # in combine.WEIGHTS is 0.00, so nothing below moves a score today — the tiers
    # exist so that when one is fitted, "used a clinical data warehouse" and "ran a
    # regression" cannot be priced as the same claim.
    #
    # THE DENOMINATOR IS LOAD-BEARING, so it is stated above rather than implied. Over
    # all 240 surfaced rows instead of the 94 in-corpus ones, every lift falls by the
    # same 2.55x (399x -> 156x, 32x -> 12.5x) and BOTH weak families invert to BELOW
    # background (1.7x -> 0.7x, 1.6x -> 0.6x) — a core-14 positive is then LESS likely
    # than a random corpus paper to carry them. Neither denominator is wrong; the
    # in-corpus one is the honest measure of what the signal can do on the papers it
    # can see, and the 2.55x is the price of the 146 positives outside the 2020+
    # first/last-author corpus. Quoting a lift without its denominator is meaningless.
    #
    # READ THE LIFTS AS AN UPPER BOUND. Part of them is agreement, not evidence: the
    # A2 extractor and signal 4 both read this paper's title+abstract, and a share of
    # these positives were surfaced by the LLM doing so. Do not lift a weight off this
    # comment; scripts/fit_evidence_weights.py is the only thing that may.
    #
    # salience_tier from the artifact is deliberately NOT used here or rendered: it is
    # a per-TOOL distinctiveness measure from the tools pipeline, not a cores-relevance
    # one, and it disagrees with this ordering (the 399x family has no S-tier tool at
    # all, while 6.2x "Machine learning classification" has 11).
    method_families:
      strong:                                        # >=30x lift on core 14
        - "Clinical data warehouse/cohort platforms" # 399x  n=7    7.4% vs 0.02%
        - "Clinical text mining"                     #  34x  n=10  10.6% vs 0.3%
        - "Electronic health record datasets"        #  32x  n=36  38.3% vs 1.2%
      moderate:                                      # ~4-7x
        - "Machine learning classification"          # 6.2x  n=15  16.0% vs 2.6%
        - "Predictive model validation"              # 4.9x  n=15  16.0% vs 3.2%
      weak:                                          # <2x — near background
        - "Regression modeling"                      # 1.7x  n=26  27.7% vs 16.6%
        - "Observational study design"               # 1.6x  n=20  21.3% vs 13.4%
