  #   paz2005/las2017).
  #   nik2004 is in neither table (not a ReCiter target person, zero resolved
  #   rows) -> tracked: false, can't fire signal 2 at all.
  # Aliases are inferred qualified variants (no acknowledgment-text survey done
  # yet) since the bare 2-word name is a generic discipline term and would be
  # collision-prone per this file's own "no bare collision-prone terms" rule —
  # revisit once real candidate acknowledgment text is available to check
  # against.
  # ---------------------------------------------------------------------------

  - core_id: "14"
    name: Research Informatics
    facility: Research Informatics
    owner_cwid: null            # TBD — designate via SPS Superuser grant.
                                 # Intended owners: evs2008 (Evan Sholle),
                                 # nik2004 (Nivedita Chang), saa3011 (Sajjad
                                 # Abedian), thc2015 (Thomas Campion).
    # ALIAS SURVEY DONE 2026-09-03 (the "revisit once real acknowledgment text is
    # available" note above). `pipeline_cores.suggest_aliases` over the 69 papers
    # humans claimed for this core in SPS — 67 have PMC full text, 33 an <ack>:
    #   alias                                        full text   refs stripped
    #   Research Informatics                             16            11   <- DROPPED
    #   Research Informatics Core                         0             0   <- DROPPED
    #   Weill Cornell Medicine Research Informatics       0             0   <- DROPPED
    #   WCM Research Informatics                          2             2
    #   Architecture for Research Computing              12             9   <- ADDED
    #   ARCH (word-boundary, case-sensitive)              9             9   <- ADDED
    # The bare 2-word term is DANGEROUS, not merely collision-prone: 5 of its 16
    # hits are the REDCap citation in the REFERENCE LIST ("…workflow process for
    # providing translational research informatics support", Harris 2009), and
    # signal 3 scans the whole body including <ref-list>. Signal 3 carries +6.37
    # nats in combine(), enough to confirm on its own, so that alias would confirm
    # every paper on earth that cites REDCap. The rest of its hits are generic keyword-list uses of the
    # discipline term. ARCH ("Architecture for Research Computing in Healthcare")
    # is the actual institutional brand and is what the body text names.
    # NB the reference-list exposure is GENERIC to signal 3, not specific to this
    # core — any alias appearing in a commonly-cited title has it. Not fixed here.
    # PMC full-text search (pipeline_cores.pmc_search) over ALL of PMC, 2026-09-03:
    #   "Architecture for Research Computing in Health"      20
    #   "Architecture for Research Computing in Healthcare"   3
    #   "Architecture for Research Computing"                25   <- covers both
    #   "WCM Research Informatics"                            2
    # 25 papers name it; 17 are in the WCM corpus, 9 of those were already
    # hand-claimed (independent validation of the alias), 8 are new confirms.
    # "ARCH" dropped: over the 67 claimed papers with full text it buys exactly
    # ONE paper the spelled-out phrase misses, and \bARCH\b matches ARCH
    # econometric models. Signal 3 alone can carry a pair to confirmed, so that
    # trade is wrong.
    aliases:
      - "Architecture for Research Computing"
      - "Architecture for Research Computing in Health"
      - "WCM Research Informatics"
    alias_hits:                 # global PMC hits per alias (refresh_alias_hits)
      "Architecture for Research Computing": 25
      "Architecture for Research Computing in Health": 20
      "WCM Research Informatics": 2
    staff:
      - { cwid: evs2008, name: "Evan Sholle",    dept: "Population Health Sciences" }
      - { cwid: thc2015, name: "Thomas Campion", dept: "Population Health Sciences" }
      - { cwid: saa3011, name: "Sajjad Abedian", dept: "" }
      - { cwid: nik2004, name: "Nivedita Chang", dept: "" }
    grant_ids: []
    llm_description: >
      research informatics service core: EHR-based reporting and clinical data
      extraction, clinical trial support, secure environments for analysis of
      research data sets, and access to high-performance/scientific computing
      resources for the research enterprise
    # A2 METHOD FAMILIES, tiered by MEASURED LIFT, 2026-09-05. Positives = the 94 of
    # core 14's 240 surfaced (confirmed/claimed/candidate) rows that are in the A2
    # corpus; background = the 5,354 A2-corpus PMIDs with no core-14 row. Every weight
    # in combine.WEIGHTS is 0.00, so nothing below moves a score today — the tiers
    # exist so that when one is fitted, "used a clinical data warehouse" and "ran a
    # regression" cannot be priced as the same claim.
    #
    # THE DENOMINATOR IS LOAD-BEARING, so it is stated above rather than implied. Over
    # all 240 surfaced rows instead of the 94 in-corpus ones, every lift falls by the
    # same 2.55x (399x -> 156x, 32x -> 12.5x) and BOTH weak families invert to BELOW
    # background (1.7x -> 0.7x, 1.6x -> 0.6x) — a core-14 positive is then LESS likely
    # than a random corpus paper to carry them. Neither denominator is wrong; the
    # in-corpus one is the honest measure of what the signal can do on the papers it
    # can see, and the 2.55x is the price of the 146 positives outside the 2020+
    # first/last-author corpus. Quoting a lift without its denominator is meaningless.
    #
    # READ THE LIFTS AS AN UPPER BOUND. Part of them is agreement, not evidence: the
    # A2 extractor and signal 4 both read this paper's title+abstract, and a share of
    # these positives were surfaced by the LLM doing so. Do not lift a weight off this
    # comment; scripts/fit_evidence_weights.py is the only thing that may.
    #
    # salience_tier from the artifact is deliberately NOT used here or rendered: it is
    # a per-TOOL distinctiveness measure from the tools pipeline, not a cores-relevance
    # one, and it disagrees with this ordering (the 399x family has no S-tier tool at
    # all, while 6.2x "Machine learning classification" has 11).
    method_families:
      strong:                                        # >=30x lift on core 14
        - "Clinical data warehouse/cohort platforms" # 399x  n=7    7.4% vs 0.02%
        - "Clinical text mining"                     #  34x  n=10  10.6% vs 0.3%
        - "Electronic health record datasets"        #  32x  n=36  38.3% vs 1.2%
