    # Soft grid c 2..4 x h 1/2/4/8 at s = 5 and s = 0: bucket 0.5712..0.6144, never 0.66.
    # Paired bootstrap (2000 resamples, n = 46 — wide): minimum 3 minus sliding, bucket
